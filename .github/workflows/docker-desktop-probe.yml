name: docker-desktop-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Inspect preinstalled Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $c = Get-Command docker -ErrorAction SilentlyContinue
            Write-Output "docker path: $($c.Source)"
          } catch {
            Write-Output "docker not found on PATH"
          }
          docker --version
          docker compose version
          Write-Output "--- preinstalled engine ostype ---"
          $o = docker info --format '{{.OSType}}' 2>&1
          Write-Output "ostype=[$o] exit=$LASTEXITCODE"
          Write-Output "--- wsl ---"
          wsl --version 2>&1 | Select-Object -First 1
          wsl -l -v 2>&1

      - name: Install Docker Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          winget install -e --id Docker.DockerDesktop --accept-source-agreements --accept-package-agreements
          Write-Output "install exit=$LASTEXITCODE"

      - name: Start Docker Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dd = "C:\Program Files\Docker\Docker\Docker Desktop.exe"
          if (Test-Path $dd) {
            Start-Process $dd -ArgumentList "--accept-license"
            Write-Output "launched Docker Desktop"
          } else {
            Write-Output "Docker Desktop.exe not found at $dd"
            exit 1
          }

      - name: Wait for Linux engine (explicit Docker Desktop CLI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ddCli = "C:\Program Files\Docker\Docker\resources\bin\docker.exe"
          Write-Output "ddCli exists: $(Test-Path $ddCli)"
          for ($i = 0; $i -lt 60; $i++) {
            $ostype = & $ddCli info --format '{{.OSType}}' 2>$null
            if ($LASTEXITCODE -eq 0 -and $ostype -eq 'linux') {
              Write-Output "LINUX ENGINE READY (ostype=$ostype) after $($i*10)s"
              exit 0
            }
            if (($i % 6) -eq 0) {
              Write-Output "waiting... $($i*10)s ostype=[$ostype] exit=$LASTEXITCODE"
              $d = wsl -l -v 2>&1 | Select-String docker-desktop
              Write-Output "distro: $d"
            }
            Start-Sleep 10
          }
          Write-Output "=== ENGINE NOT READY - diagnostics ==="
          Write-Output "--- wsl distros ---"
          wsl -l -v 2>&1
          Write-Output "--- DD process ---"
          [bool](Get-Process 'Docker Desktop' -ErrorAction SilentlyContinue)
          Write-Output "--- ddCli info ---"
          & $ddCli info 2>&1 | Select-Object -First 15
          exit 1

      - name: Run a Linux container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ddCli = "C:\Program Files\Docker\Docker\resources\bin\docker.exe"
          & $ddCli run --rm hello-world
